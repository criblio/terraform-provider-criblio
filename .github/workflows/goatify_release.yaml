# Goatify CLI release workflow. Triggers on tags: goatify-v0.0.1, goatify-v0.0.2, etc.
name: Goatify Release

on:
  push:
    tags:
      - 'goatify-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing goatify tag to release (for example, goatify-v0.0.32)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Existing goatify tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}

      - uses: actions/setup-go@v4.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Prepare tag for GoReleaser
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" != goatify-v* ]]; then
            echo "Expected a goatify-v* tag, got: $TAG" >&2
            exit 1
          fi

          # Use v0.0.1-goatify format: valid semver, no collision with provider v0.0.1
          GORELEASER_TAG="v${TAG#goatify-v}-goatify"
          if git rev-parse -q --verify "refs/tags/$GORELEASER_TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$GORELEASER_TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$GORELEASER_TAG"
            git push origin "$GORELEASER_TAG"
          fi
          echo "GORELEASER_CURRENT_TAG=$GORELEASER_TAG" >> $GITHUB_ENV
          echo "GOATIFY_VERSION=${TAG#goatify-v}" >> $GITHUB_ENV

      # GoReleaser sets tools/import-cli/version.Version from the tag (see ldflags in
      # .goreleaser-goatify.yml) so User-Agent and --version match the release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --config .goreleaser-goatify.yml --clean -p 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
